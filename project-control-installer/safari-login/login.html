<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1421"><title>Sign in — Project Control Center</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0d1421;color:#eaf0f7;display:flex;justify-content:center;align-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px}
main{width:min(100%,420px);background:#182335;border:1px solid #2a3a51;border-radius:18px;padding:30px;box-shadow:0 14px 50px #0005}h1{margin:5px 0 10px;font-size:26px;letter-spacing:-.04em}p{color:#a9bdd3;line-height:1.45}.eyebrow{color:#73b2ff;font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:700}label{display:block;font-weight:600;margin:18px 0 7px}input{display:block;width:100%;font:inherit;color:#fff;background:#111b2b;border:1px solid #55677f;padding:13px 14px;border-radius:10px}input:focus-visible,button:focus-visible{outline:2px solid #73b2ff;outline-offset:2px}button{width:100%;font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;background:#326dae;color:white;padding:13px;margin-top:22px}.tip{font-size:12px;margin-top:21px}.error{display:none;color:#ff9797;border-left:3px solid #ff9797;padding:8px;background:#432536;border-radius:6px}
body[data-error="1"] .error{display:block}
</style></head>
<body><main><div class="eyebrow">Private dashboard</div><h1>Project Control Center</h1><p>Sign in with the admin password stored on your Unraid server.</p><p class="error" id="error" role="alert">Incorrect username or password. Please try again.</p>
<form action="/login" method="post" autocomplete="on"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="admin" required maxlength="100"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
<p class="tip">Tailscale must be connected. This private HTTP connection is intended for your trusted Tailscale network, not a public Internet port.</p></main>
</body></html>
