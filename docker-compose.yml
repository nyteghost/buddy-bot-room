# Pixel Pals — one command to host it:  docker compose up -d --build
# Then open http://<this-machine>:8090
#
# Optional settings (Seerr, SearXNG address) go in .env.local — copy .env.local.example.
services:
  buddy-bot:
    build:
      context: .
      target: ${BUDDY_TARGET:-dev}
    image: buddy-bot-room:local
    container_name: buddy-bot-room
    restart: unless-stopped
    ports:
      - "${BUDDY_PORT:-8090}:8090"
    env_file:
      - path: .env.local
        required: false
    extra_hosts:
      # lets the container reach services on the host, e.g. an existing SearXNG on :8081
      - "host.docker.internal:host-gateway"

  # Optional: a SearXNG just for the pals. Start with:  docker compose --profile search up -d
  # and set SEARXNG_URL=http://searxng:8080 in .env.local. Skip this if you already run SearXNG.
  searxng:
    profiles: ["search"]
    image: searxng/searxng:latest
    container_name: buddy-bot-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng:/etc/searxng
