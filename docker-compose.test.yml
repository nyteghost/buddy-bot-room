# Throwaway test of the build on port 18091 (nothing shared with the real stack). Delete the stack when done.
services:
  buddy-bot-test:
    build:
      context: .
      target: dev
    image: buddy-bot-room:test
    pull_policy: build
    container_name: buddy-bot-test
    ports:
      - "18091:8090"
    environment:
      BUDDY_TZ: America/New_York
  buddy-bot-test-prod:
    build:
      context: .
      target: prod
    image: buddy-bot-room:test-prod
    pull_policy: build
    container_name: buddy-bot-test-prod
    ports:
      - "18092:8090"
    environment:
      BUDDY_TZ: America/New_York
