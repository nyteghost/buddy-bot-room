name: Publish beta image

# Publish a beta-only image after CI's tests, production build, and browser smoke test succeed
# on a push to the beta branch. Never update :latest (reserved for main).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [beta]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-beta-image
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'beta'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Only publish the current beta branch tip
        id: current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head_sha=$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/beta | cut -f1)
          if [ "$head_sha" = "$TESTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping an older beta commit; tested=$TESTED_SHA current=$head_sha"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish beta tags
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/buddy-bot-room:beta
            ghcr.io/${{ github.repository_owner }}/buddy-bot-room:beta-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
