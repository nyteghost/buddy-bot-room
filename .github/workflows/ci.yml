name: CI

# Runs the tests and a production build on every push and pull request, so a broken change shows up before you redeploy.
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Build
        run: |
          bun run build > build.log 2>&1 && exit 0
          msg=$(tail -n 25 build.log | cut -c1-300 | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s | ", $0}')
          echo "::error title=Build failed::${msg}"
          exit 1

  # Starts the production build and clicks through the app in a real browser, failing on any page or console error.
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build (self-hosted flavour)
        run: bun run build
        env:
          BUDDY_SELF_HOSTED: "1"
          NITRO_PRESET: node-server
          NODE_ENV: production
      - name: Install the test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 --no-audit --no-fund
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Start the app
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          BUDDY_SELF_HOSTED=1 BUDDY_DATA_DIR="$RUNNER_TEMP/data" PORT=8090 HOST=0.0.0.0 NODE_ENV=production nohup bun .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://localhost:8090/__health >/dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Smoke test
        run: |
          node tools/smoke/smoke.mjs > smoke.log 2>&1 && { cat smoke.log; exit 0; }
          cat smoke.log
          msg=$(tail -n 30 smoke.log | cut -c1-260 | awk '{printf "%s | ", $0}')
          echo "::error title=Smoke test failed::${msg}"
          exit 1
        env:
          PW_PATH: ${{ runner.temp }}/pw/node_modules/playwright
          SMOKE_URL: http://localhost:8090
          SMOKE_SHOT: ${{ runner.temp }}/smoke.png
      - name: Frontend profile (informational)
        continue-on-error: true
        run: node tools/smoke/profile.mjs 2>&1 | tee profile.log
        env:
          PW_PATH: ${{ runner.temp }}/pw/node_modules/playwright
          SMOKE_URL: http://localhost:8090
      - name: Server log
        if: always()
        run: tail -n 60 server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
