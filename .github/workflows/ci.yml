name: CI

# Runs the tests and a production build on every push and pull request, so a broken change shows up before you redeploy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log || { tail -c 3000 build.log | tr '\n' ' ' | sed 's/%/%25/g' | xargs -0 -I{} echo "::error title=Build output::{}"; exit 1; }
