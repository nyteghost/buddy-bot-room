name: CI

# Runs the tests and a production build on every push and pull request, so a broken change shows up before you redeploy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Build
        run: |
          bun run build > build.log 2>&1 && exit 0
          msg=$(tail -n 25 build.log | cut -c1-300 | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s | ", $0}')
          echo "::error title=Build failed::${msg}"
          exit 1
