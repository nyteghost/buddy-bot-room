name: ShowPilot standalone checks
on:
  push:
    branches: [feat/showpilot-standalone]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Upload offline browser build
        uses: actions/upload-artifact@v4
        with:
          name: showpilot-browser-beta
          path: dist/
