name: ShowPilot standalone checks
on:
  push:
    branches: [feat/showpilot-standalone]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun run check
      - run: bun test
      - run: bun run build
      - name: Upload offline browser build
        uses: actions/upload-artifact@v4
        with:
          name: showpilot-browser-beta
          path: dist/
