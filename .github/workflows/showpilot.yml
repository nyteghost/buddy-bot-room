name: ShowPilot standalone checks
on:
  push:
    branches: [main, beta, feat/showpilot-standalone]
  workflow_dispatch:
concurrency:
  group: showpilot-${{ github.ref_name }}-validation
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun run check
      - run: node --check desktop/main.cjs && node --check desktop/preload.cjs && node --check desktop/google-calendar.cjs && node --check desktop/ai-vault.cjs && node --check desktop/app-updates.cjs
      - run: bun test
      - run: bun run build
      - name: Upload offline browser build
        uses: actions/upload-artifact@v4
        with:
          name: showpilot-browser-beta
          path: dist/
  windows-portable:
    needs: check
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun run build
      - name: Package portable Windows application
        run: bunx electron-builder --win dir --x64 --publish never
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/ShowPilot-Portable-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-windows-portable
          path: release/ShowPilot-Portable-Windows.zip
          if-no-files-found: error
