name: Publish images

# Builds the Pixel Pals images once on GitHub and publishes them to the GitHub Container Registry,
# so Unraid (or Portainer) only has to download them instead of building on your own machine.
#   ghcr.io/nyteghost/buddy-bot-room       the app
#   ghcr.io/nyteghost/pixelpals-radicale   the optional iPhone Reminders (CalDAV) server
# After the first run, open each package on GitHub -> Package settings -> Change visibility -> Public,
# otherwise Unraid cannot pull it without logging in.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/buddy-bot-room:latest
            ghcr.io/${{ github.repository_owner }}/buddy-bot-room:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  radicale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./packaging/radicale
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pixelpals-radicale:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
