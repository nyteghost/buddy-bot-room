name: Publish pinned Stage 4A TEST image (no deployment)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [beta]

permissions:
  contents: read
  packages: write

concurrency:
  group: stage4a-test-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate:
    # Only the user's separate same-repo integration branch, never forks or beta/main.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/iso-stage4a-20261112' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level high
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build
      - name: Verify isolated Compose contract without starting Docker
        env:
          STAGE4A_IMAGE: ghcr.io/nyteghost/buddy-bot-room@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          STAGE4A_SETUP_CODE: CI-disposable-not-a-live-password
        run: |
          docker compose -f docker-compose.unraid-stage4a-test.yml config --format json | python3 tools/stage4a/validate-compose.py
          docker compose -f docker-compose.unraid-stage4a-test.yml config --quiet
  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          BUDDY_SELF_HOSTED: "1"
          NITRO_PRESET: node-server
          NODE_ENV: production
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 --no-audit --no-fund
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Start ephemeral CI-only application on runner (NOT a Docker container or Unraid)
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/vault"
          node tools/smoke/ollama.mjs > "$RUNNER_TEMP/ollama.log" 2>&1 &
          echo '{"sources":[],"items":[],"status":{},"lastRun":""}' > "$RUNNER_TEMP/data/playtests.json"
          BUDDY_PASSWORD="Smoke-CI-Setup-Only" BUDDY_SELF_HOSTED=1 BUDDY_DATA_DIR="$RUNNER_TEMP/data" OBSIDIAN_VAULT_DIR="$RUNNER_TEMP/vault" UPDATE_CHECK=0 MODEL_FEED=0 PORT=8090 HOST=127.0.0.1 NODE_ENV=production nohup bun .output/server/index.mjs > "$RUNNER_TEMP/stage4a-server.log" 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://localhost:8090/__health >/dev/null && exit 0; sleep 1; done
          tail -n 80 "$RUNNER_TEMP/stage4a-server.log"; exit 1
      - run: node tools/smoke/smoke.mjs
        env:
          PW_PATH: ${{ runner.temp }}/pw/node_modules/playwright
          SMOKE_URL: http://localhost:8090
          SMOKE_SETUP_CODE: Smoke-CI-Setup-Only
          SMOKE_SHOT: ${{ runner.temp }}/stage4a-browser-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4a-browser-smoke
          path: ${{ runner.temp }}/stage4a-browser-smoke.png
          if-no-files-found: ignore
  publish:
    needs: [validate, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64
          build-args: |
            BUN_VERSION=1.4.4
            BUDDY_REF=${{ github.event.pull_request.head.sha }}
            BUDDY_COMMIT=${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=stage4a-test-${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.description=NON-PRODUCTION isolated Stage 4A personal test image
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:stage4a-test-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=stage4a-test
          cache-to: type=gha,mode=max,scope=stage4a-test
      - name: Verify immutable test image; record digest, never tag production
        env:
          TAG: ghcr.io/${{ github.repository }}:stage4a-test-${{ github.event.pull_request.head.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          docker buildx imagetools inspect "$TAG" > "$RUNNER_TEMP/stage4a-image-inspect.txt"
          grep -F "$DIGEST" "$RUNNER_TEMP/stage4a-image-inspect.txt"
          echo "Stage 4A separate TEST image (digest-pinned): ghcr.io/${{ github.repository }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "No Docker container deployed or started. Never deploy to Unraid without separate owner approval." >> "$GITHUB_STEP_SUMMARY"
