# Weekly pull requests for out-of-date dependencies. They open against the beta branch (upgrade/local-first), run the full CI there,
# and nothing is merged or deployed automatically.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "upgrade/local-first"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "upgrade/local-first"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 2
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "upgrade/local-first"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 2
