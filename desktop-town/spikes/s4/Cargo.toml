[package]
name = "pixel-pals-s4"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
# Dependency versions are resolved by the committed Cargo.lock; build with --locked.
rust-version = "1.88"
build = "build.rs"

[[bin]]
name = "PixelPals"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# wgpu 27: D3D12 DirectComposition presentation (Dx12SwapchainKind::DxgiFromVisual)
# is required for a transparent D3D12 swapchain; wgpu 0.19 HWND swapchains are opaque-only.
wgpu = "27"
# Dx12SwapchainKind is not re-exported at the wgpu 27 crate root.
wgpu-types = "27"
winit = "0.29"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
