<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pixel Pals S2 Canvas Performance Spike</title></head>
<body><canvas id="town" aria-label="Transparent isometric Canvas town"></canvas>
<section id="hud">
  <h1>Pixel Pals — S2 / Canvas baseline</h1>
  <p id="status" aria-live="polite">Idle</p>
  <button id="toggle" type="button">Walk Pal</button>
  <label for="actors">Synthetic Pals (0–128)</label>
  <input id="actors" type="number" min="0" max="128" step="1" value="1">
  <button id="apply-count" type="button">Set count</button>
  <div class="bench">
    <button id="bench-idle" type="button">Idle 60s</button>
    <button id="bench-walk" type="button">Walk 60s</button>
    <button id="bench-soak" type="button">Soak 30m</button>
  </div>
  <p>Benchmark output appears below. Alt+F4 closes the test window.</p>
</section>
<pre id="result" hidden></pre>
<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/controls.ts"></script></body></html>
