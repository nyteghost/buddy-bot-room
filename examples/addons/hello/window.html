<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #888; cursor: pointer; }
  #n { font-size: 48px; font-weight: 800; margin: 12px 0; }
</style>
<h2>Hello add-on</h2>
<p>This page runs in a sandbox. It talks to its server code with <code>pp.call()</code>.</p>
<div id="n">…</div>
<button id="b">Say hello</button>
<script>
  pp.call("count").then(function (n) { document.getElementById("n").textContent = n; });
  document.getElementById("b").onclick = function () {
    pp.call("bump").then(function (n) { document.getElementById("n").textContent = n; });
  };
</script>
