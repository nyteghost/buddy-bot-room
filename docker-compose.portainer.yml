# For Portainer: Stacks -> Add stack -> Repository, "Compose path" = docker-compose.portainer.yml
# Settings come from the stack's "Environment variables" panel (no .env.local file needed):
#   SEERR_URL, SEERR_API_KEY, SEARXNG_URL, BUDDY_PORT, BUDDY_PASSWORD,
#   JELLYFIN_URL, JELLYFIN_API_KEY, JELLYFIN_PUBLIC_URL,
#   PLEX_URL, PLEX_TOKEN, BUDDY_ACCOUNTS, TRAKT_CLIENT_ID, TRAKT_USER, TRAKT_LIST, TRAKT_ACCESS_TOKEN, UNRAID_URL, UNRAID_API_KEY, UNRAID_CHECK_SECONDS, NTFY_URL, BUDDY_TZ, BUDDY_BACKUP_PATH, BUDDY_BACKUP_TIME, BUDDY_BACKUP_KEEP  (all optional)
services:
  buddy-bot:
    build:
      context: .
      target: dev
    image: buddy-bot-room:local
    pull_policy: build   # Portainer: rebuild the image on every redeploy
    container_name: buddy-bot-room
    restart: unless-stopped
    ports:
      - "${BUDDY_PORT:-8090}:8090"
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:8081}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      BUDDY_PASSWORD: ${BUDDY_PASSWORD:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      BUDDY_ACCOUNTS: ${BUDDY_ACCOUNTS:-1}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_USER: ${TRAKT_USER:-}
      TRAKT_LIST: ${TRAKT_LIST:-watchlist}
      TRAKT_ACCESS_TOKEN: ${TRAKT_ACCESS_TOKEN:-}
      UNRAID_URL: ${UNRAID_URL:-}
      UNRAID_API_KEY: ${UNRAID_API_KEY:-}
      UNRAID_CHECK_SECONDS: ${UNRAID_CHECK_SECONDS:-60}
      NTFY_URL: ${NTFY_URL:-}
      BUDDY_TZ: ${BUDDY_TZ:-America/New_York}
      BUDDY_BACKUP_DIR: /backups
      BUDDY_BACKUP_TIME: ${BUDDY_BACKUP_TIME:-03:30}
      BUDDY_BACKUP_KEEP: ${BUDDY_BACKUP_KEEP:-14}
    volumes:
      - buddy-data:/data   # saved chats and the server log live here
      # Nightly backups. Set BUDDY_BACKUP_PATH to a folder on another machine (e.g. a mounted Unraid share) to survive a disk failure.
      - ${BUDDY_BACKUP_PATH:-buddy-backups}:/backups
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8090/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  buddy-backups:
  buddy-data:
