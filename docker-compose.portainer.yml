# For Portainer: Stacks -> Add stack -> Repository, "Compose path" = docker-compose.portainer.yml
# Settings come from the stack's "Environment variables" panel (no .env.local file needed):
#   SEERR_URL, SEERR_API_KEY, SEARXNG_URL, BUDDY_PORT, BUDDY_PASSWORD,
#   JELLYFIN_URL, JELLYFIN_API_KEY, JELLYFIN_PUBLIC_URL,
#   PLEX_URL, PLEX_TOKEN, BUDDY_ACCOUNTS, TRAKT_CLIENT_ID, TRAKT_USER, TRAKT_LIST, TRAKT_ACCESS_TOKEN, TRAKT_CLIENT_SECRET, UNRAID_URL, UNRAID_API_KEY, UNRAID_CHECK_SECONDS, NTFY_URL, BUDDY_TZ, BRIEF_TIME, BUDDY_BACKUP_PATH, BUDDY_BACKUP_TIME, BUDDY_BACKUP_KEEP, OLLAMA_PORT, OLLAMA_MODELS, OLLAMA_RUNTIME, LOCAL_VRAM_GB, MODEL_FEED, PROVIDER_FEED, ALLOW_PRIVATE_CUSTOM, COMPOSE_PROFILES, WHISPER_REPLICAS, TS_AUTHKEY, TS_HOSTNAME, WHISPER_URL, WHISPER_MODEL, WHISPER_IMAGE, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, M365_CLIENT_ID, M365_TENANT, CALENDAR_ICS_URLS, IMAP_HOST, IMAP_PORT, IMAP_USER, IMAP_PASS  (all optional)
# Ollama is included in this stack. It starts on CPU; for an NVIDIA GPU set OLLAMA_RUNTIME=nvidia (needs the NVIDIA Container Toolkit on the host).
# In Pixel Pals choose the engine "Local AI (this server)": it talks to this Ollama itself, so there is nothing to type and no HTTPS problem.
services:
  buddy-bot:
    build:
      context: .
      target: dev
    image: buddy-bot-room:local
    pull_policy: build   # Portainer: rebuild the image on every redeploy
    container_name: buddy-bot-room
    restart: unless-stopped
    runtime: ${OLLAMA_RUNTIME:-runc}
    ports:
      - "${BUDDY_PORT:-8090}:8090"
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:8081}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      BUDDY_PASSWORD: ${BUDDY_PASSWORD:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      BUDDY_ACCOUNTS: ${BUDDY_ACCOUNTS:-1}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_USER: ${TRAKT_USER:-}
      TRAKT_LIST: ${TRAKT_LIST:-watchlist}
      TRAKT_ACCESS_TOKEN: ${TRAKT_ACCESS_TOKEN:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}   # only for /trakt connect (adding to your watchlist)
      UNRAID_URL: ${UNRAID_URL:-}
      UNRAID_API_KEY: ${UNRAID_API_KEY:-}
      UNRAID_CHECK_SECONDS: ${UNRAID_CHECK_SECONDS:-60}
      NTFY_URL: ${NTFY_URL:-}
      BUDDY_TZ: ${BUDDY_TZ:-America/New_York}
      BRIEF_TIME: ${BRIEF_TIME:-}
      BUDDY_BACKUP_DIR: /backups
      BUDDY_BACKUP_TIME: ${BUDDY_BACKUP_TIME:-03:30}
      BUDDY_BACKUP_KEEP: ${BUDDY_BACKUP_KEEP:-14}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}   # Local AI engine; the bundled Ollama below
      ALLOW_PRIVATE_CUSTOM: ${ALLOW_PRIVATE_CUSTOM:-}   # 1 = Custom provider may use LAN addresses
      PROVIDER_FEED: ${PROVIDER_FEED:-1}   # 0 = never fetch the community list of free LLM APIs
      MODEL_FEED: ${MODEL_FEED:-1}   # 0 = never check ollama.com for new models
      LOCAL_VRAM_GB: ${LOCAL_VRAM_GB:-}   # only if the GPU isn't detected
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}   # voice input, served by the whisper container below
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      CALENDAR_ICS_URLS: ${CALENDAR_ICS_URLS:-}   # private .ics links for the Calendar window (comma separated)
      IMAP_HOST: ${IMAP_HOST:-}   # unread mail subjects for the Mail window (read-only; use an app password)
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}   # optional, read-only work calendar/mail (see README)
      M365_TENANT: ${M365_TENANT:-organizations}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}   # optional: talk to your pals from Telegram
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NVIDIA_VISIBLE_DEVICES: all   # with OLLAMA_RUNTIME=nvidia this lets Pixel Pals read the GPU for model suggestions
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - buddy-data:/data   # saved chats and the server log live here
      # Nightly backups. Set BUDDY_BACKUP_PATH to a folder on another machine (e.g. a mounted Unraid share) to survive a disk failure.
      - ${BUDDY_BACKUP_PATH:-buddy-backups}:/backups
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8090/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: buddy-ollama
    restart: unless-stopped
    runtime: ${OLLAMA_RUNTIME:-runc}   # set OLLAMA_RUNTIME=nvidia to use an NVIDIA GPU
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"   # Pixel Pals calls Ollama from your browser
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ollama-models:/root/.ollama

  # One-shot helper: downloads the models in OLLAMA_MODELS (space separated) the first time, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: buddy-ollama-pull
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_MODELS:-qwen2.5:7b nomic-embed-text}
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; for m in $$MODELS; do ollama pull $$m; done"]

  # Speech-to-text for the microphone button, part of the stack. CPU image by default (set WHISPER_IMAGE for a GPU build).
  # Set WHISPER_REPLICAS=0 to leave it off. The helper below downloads the model on first start.
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    container_name: buddy-whisper
    restart: unless-stopped
    deploy:
      replicas: ${WHISPER_REPLICAS:-1}
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

  # One-shot helper: asks the Whisper server to download its speech model so the first dictation is instant. Best effort.
  whisper-pull:
    image: curlimages/curl:latest
    container_name: buddy-whisper-pull
    restart: "no"
    depends_on:
      - whisper
    environment:
      MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
    entrypoint: ["/bin/sh", "-c", "for i in $$(seq 1 60); do curl -fsS http://whisper:8000/health >/dev/null 2>&1 && break; sleep 3; done; curl -sS -X POST \"http://whisper:8000/v1/models/$$MODEL\" >/dev/null 2>&1 || true; exit 0"]

  # Optional private HTTPS link to Pixel Pals from your phone/laptop anywhere, with no open ports and no Caddy.
  # Turn on with COMPOSE_PROFILES=tailscale and set TS_AUTHKEY (a reusable key from the Tailscale admin console).
  # It appears as https://<TS_HOSTNAME>.<your-tailnet>.ts.net. Needs HTTPS enabled in your Tailscale DNS settings.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: buddy-tailscale
    profiles: ["tailscale"]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-pixelpals}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-pixelpals}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    depends_on:
      - buddy-bot

configs:
  # Same as config/tailscale/serve.json in the repository: send HTTPS on your tailnet to Pixel Pals.
  tailscale-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://buddy-bot:8090"}}}}}

volumes:
  tailscale-state:
  whisper-models:
  buddy-backups:
  buddy-data:
  ollama-models:
